name: Deploy to Cloud Run

# Manual trigger only — never on push. Requires the one-time GCP setup in
# docs/GCP_DEPLOY_RUNBOOK.md to already be done (project, Artifact Registry
# repo, Cloud SQL instance, Secret Manager entries, Workload Identity
# Federation). Cannot be functionally verified without that setup existing —
# see the runbook and the paired handoff report for exactly what's untested.
#
# Order matters here in a way that isn't obvious: apps/web's NEXT_PUBLIC_*
# values are inlined into the client bundle at `docker build` time (Next.js
# behavior, not a Cloud Run concern), and NEXT_PUBLIC_API_BASE needs the
# API's actual Cloud Run URL — which only exists once the API has been
# deployed at least once. So: migrate -> deploy API -> read its URL ->
# *then* build the web image -> deploy web. Building web before the API
# exists would bake in a wrong/empty API base URL.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for both images (defaults to the commit SHA)"
        required: false
        type: string

env:
  GCP_REGION: us-central1 # Example only — pick based on real user geography before the first deploy; see the runbook.
  AR_REPO: filmrave
  API_SERVICE: filmrave-api
  WEB_SERVICE: filmrave-web

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      # Workload Identity Federation — no long-lived service-account key ever
      # stored in GitHub Secrets. See docs/GCP_DEPLOY_RUNBOOK.md for the
      # one-time pool/provider/service-account setup this depends on.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --- API: build, push, migrate, deploy -----------------------------
      - name: Build API image
        run: |
          docker build -f apps/api/Dockerfile \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ steps.tag.outputs.tag }} .
      - name: Push API image
        run: docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ steps.tag.outputs.tag }}

      # The Cloud SQL Auth Proxy is what lets this GitHub-hosted runner (not
      # Cloud Run itself) reach Cloud SQL — Cloud Run's native socket
      # integration only exists *inside* Cloud Run. The proxy authenticates
      # using this job's already-established WIF identity.
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy -L "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" &
          sleep 3
      - name: Run pending migrations (before any deploy, never after)
        working-directory: apps/api
        env:
          # postgresql://USER:PASS@localhost:5432/DBNAME — via the proxy
          # tunnel above. Deliberately NOT the same value as the Cloud-Run
          # runtime DATABASE_URL secret below (that one uses the
          # /cloudsql/... socket path, which only resolves inside Cloud Run).
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma migrate deploy
        # If this step fails, the workflow stops here — no Cloud Run
        # deployment happens, the currently-serving revision is untouched.

      - name: Deploy API to Cloud Run
        id: deploy-api
        run: |
          gcloud run deploy ${{ env.API_SERVICE }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ steps.tag.outputs.tag }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --add-cloudsql-instances "${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,TMDB_API_KEY=TMDB_API_KEY:latest" \
            --set-env-vars "NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},CORS_ORIGINS=${{ vars.WEB_ORIGIN }}" \
            --allow-unauthenticated \
            --port 8080
          echo "url=$(gcloud run services describe ${{ env.API_SERVICE }} --region ${{ env.GCP_REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # --- Web: build (needs the API's now-known URL), push, deploy ------
      - name: Build web image
        # NEXT_PUBLIC_* values are inlined at `docker build` time (see
        # apps/web/Dockerfile) — passing the API's real URL as a build arg
        # here, not as a later Cloud Run runtime env var, is the whole point
        # of deploying the API first and reading its URL back above.
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE="${{ steps.deploy-api.outputs.url }}/api/v1" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/web:${{ steps.tag.outputs.tag }} .
      - name: Push web image
        run: docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/web:${{ steps.tag.outputs.tag }}
      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/web:${{ steps.tag.outputs.tag }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --set-env-vars "NODE_ENV=production" \
            --allow-unauthenticated \
            --port 8080
